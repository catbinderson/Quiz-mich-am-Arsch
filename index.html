<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120e13"><meta name="apple-mobile-web-app-capable" content="yes"><title>Quiz mich am Arsch!</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4a1728,#120e13 65%);color:#fff;min-height:100dvh}main{max-width:560px;margin:auto;padding:24px 18px 45px}header{text-align:center}h1{font-size:clamp(32px,8vw,48px);line-height:1.05;margin:22px 0 8px}h1 span{color:#ffca67}.muted{color:#c6b9c0}.panel{background:#241b26;border:1px solid #654354;border-radius:24px;padding:22px;margin-top:24px;box-shadow:0 15px 45px #0006}.pill{display:inline-block;border-radius:30px;background:#65273b;padding:7px 13px;font-weight:800;font-size:12px;letter-spacing:.05em}button{cursor:pointer;border:1px solid #825266;border-radius:15px;padding:15px;color:#fff;background:#352535;font-size:16px;font-weight:700;width:100%;text-align:left;margin:6px 0}button:disabled{opacity:.8}button.primary{background:#e43d63;border:0;text-align:center}button.correct{background:#155d42;border-color:#2bd88d}button.wrong{background:#83283b;border-color:#ff5777}.stats{display:flex;justify-content:space-between;gap:10px;color:#ffca67;font-weight:800}.bar{height:8px;background:#493444;border-radius:20px;overflow:hidden;margin:15px 0}.bar>div{height:100%;background:#ffca67;transition:width .2s}.feedback{background:#3d2935;border-radius:16px;padding:16px;margin:16px 0;line-height:1.5}.hidden{display:none}footer{text-align:center;margin:30px 0;color:#a997a3;font-size:12px}label{display:flex;gap:10px;align-items:center;margin:14px 0}input{accent-color:#e43d63}h2{font-size:24px;line-height:1.3}small{color:#c6b9c0}
</style></head><body><main><header><div class="pill">🔞 AB 18 · V1.0.0</div><h1>QUIZ MICH <span>AM ARSCH!</span></h1><p class="muted">10 Fragen. 4 Antworten. Null Gnade.</p></header>
<section class="panel" id="start"><h2>Willkommen im intellektuellen Totalschaden. 🍺</h2><p>Fangfragen, schwarzer Humor und Sprüche, die dein Ego beim Jugendamt melden würden.</p><label><input type="checkbox" id="adult"> Ich bin mindestens 18 und vertrage derben Humor.</label><label><input type="checkbox" id="sound" checked> Soundeffekte aktivieren</label><p id="best"></p><button class="primary" id="begin">Ab in die Hölle des Halbwissens →</button></section>
<section class="panel hidden" id="game"><div class="stats"><span id="progress"></span><span id="score"></span></div><div class="bar"><div id="fill"></div></div><h2 id="question"></h2><div id="answers"></div><div class="feedback hidden" id="feedback"></div><button class="primary hidden" id="next">Nächste Gemeinheit →</button></section>
<section class="panel hidden" id="finish"><h2 id="result"></h2><p id="resultText"></p><button class="primary" id="again">Noch mal blamieren</button><button id="share">Ergebnis teilen</button></section><footer>designed & developed by Andreas Binder · Version 1.0.0</footer></main>
<script>
const bank=[
["Was wird größer, je mehr man davon wegnimmt?",["Der Bierbauch","Ein Loch","Die Steuerlast","Die Ausrede"],1,"Ein Loch. Herzlichen Glückwunsch, du hast die Leere verstanden."],
["Was gehört dir, wird aber öfter von anderen benutzt?",["Dein Name","Dein Kater","Deine Zahnbürste","Dein Konto"],0,"Dein Name. Meistens, wenn über dich gelästert wird."],
["Was hat einen Hals, aber keinen Kopf?",["Eine Bierflasche","Ein Sarg","Ein Finanzamt","Ein schlechter Witz"],0,"Die Flasche. Wenigstens hat die manchmal noch Inhalt."],
["Was wird nass, während es trocknet?",["Ein Handtuch","Ein Friedhof","Eine Rechnung","Ein Korken"],0,"Ein Handtuch. Deine Denkfalten bleiben leider trocken."],
["Was kann man brechen, ohne es anzufassen?",["Ein Versprechen","Einen Tresen","Eine Flasche","Einen Stuhl"],0,"Ein Versprechen. Politiker nennen das Dienstag."],
["Was hat viele Schlüssel, öffnet aber keine Tür?",["Ein Klavier","Ein Hausmeister","Ein Schlüsseldienst","Ein Gefängnis"],0,"Ein Klavier. Und im Gegensatz zu dir trifft es manchmal den richtigen Ton."],
["Was hat Zähne, kann aber nicht beißen?",["Ein Kamm","Ein Hai","Ein Zahnarzt","Ein Hund"],0,"Ein Kamm. Immerhin ist hier noch etwas zu retten."],
["Was läuft, hat aber keine Beine?",["Eine Uhr","Ein Marathonläufer","Ein Kellner","Ein Dackel"],0,"Eine Uhr. Sie läuft sogar, wenn du geistig stehen bleibst."],
["Was hat Städte, aber keine Häuser?",["Eine Landkarte","Ein Campingplatz","Eine Ruine","Ein Bauamt"],0,"Eine Landkarte. Perfekt für Leute, die sich sogar im eigenen Kopf verlaufen."],
["Was kannst du halten, ohne es anzufassen?",["Dein Wort","Eine Kiste","Ein Bierglas","Ein Lenkrad"],0,"Dein Wort. Bei manchen Menschen ist das allerdings reine Fiktion."],
["Was hat ein Auge, kann aber nicht sehen?",["Eine Nadel","Ein Pirat","Ein Adler","Ein Fisch"],0,"Eine Nadel. Und trotzdem blickt sie besser durch als mancher Stammtisch."],
["Was hat Hände, aber keine Finger?",["Eine Uhr","Ein Handschuh","Ein Pianist","Ein Chirurg"],0,"Eine Uhr. Die Zeit läuft dir davon, das Wissen offenbar hinterher."],
["Was kann um die Welt reisen und bleibt doch in der Ecke?",["Eine Briefmarke","Ein Pilot","Ein Koffer","Ein Tourist"],0,"Eine Briefmarke. Mehr Fernweh als dein Sofa."],
["Was hat ein Bett, schläft aber nie?",["Ein Fluss","Ein Hotel","Ein Krankenhaus","Ein Hund"],0,"Ein Fluss. Auch der hat mehr Bewegung als manche Karriere."],
["Was hat Blätter, ist aber kein Baum?",["Ein Buch","Ein Kaktus","Eine Palme","Ein Busch"],0,"Ein Buch. Dieses mysteriöse Ding ohne Scrollfunktion."],
["Was steigt, kommt aber nie wieder herunter?",["Dein Alter","Ein Aufzug","Ein Ballon","Eine Drohne"],0,"Dein Alter. Die Würde kann allerdings schon früher abstürzen."],
["Was hat vier Beine und kann nicht laufen?",["Ein Tisch","Ein Pferd","Ein Hund","Eine Katze"],0,"Ein Tisch. Er steht wenigstens zu seinen Fehlern."],
["Was kann man fangen, aber nicht werfen?",["Eine Erkältung","Einen Ball","Einen Stein","Ein Frisbee"],0,"Eine Erkältung. Das ist kein Mannschaftssport, auch wenn manche alles teilen."],
["Was kommt einmal in Minute, zweimal in Moment und nie in Stunde vor?",["Der Buchstabe M","Der Buchstabe N","Der Buchstabe E","Der Buchstabe T"],0,"Das M. Buchstaben zählen: der Endgegner nach drei Weizen."],
["Welcher Monat hat 28 Tage?",["Nur Februar","Alle zwölf","Nur Januar","Nur Dezember"],1,"Alle zwölf. Februar ist nur der Monat, der damit hausieren geht."],
["Was hat einen Ring, aber keinen Finger?",["Ein Telefon","Ein Handschuh","Ein Handschlag","Eine Hand"],0,"Ein Telefon. Und es klingelt grundsätzlich, wenn du auf dem Klo sitzt."],
["Was hat einen Rücken, aber keine Wirbelsäule?",["Ein Buch","Ein Skelett","Ein Hund","Ein Mensch"],0,"Ein Buch. Es hat auch Inhalt – versuch's mal."],
["Was kann man verlieren, obwohl man es nie besessen hat?",["Die Geduld","Ein Auto","Eine Wohnung","Ein Fahrrad"],0,"Die Geduld. Bei diesem Quiz besonders schnell."],
["Was ist voller Löcher und hält trotzdem Wasser?",["Ein Schwamm","Ein Sieb","Ein Netz","Ein Korb"],0,"Ein Schwamm. Er saugt mehr auf als so mancher Schüler."],
["Was hat einen Fuß, aber kein Bein?",["Ein Berg","Ein Marathonläufer","Ein Storch","Ein Schuh"],0,"Ein Berg. Sein Fuß steht wenigstens auf festem Boden."]
];
let deck=[],pos=0,points=0,locked=false,ctx;const $=id=>document.getElementById(id);
function beep(ok){if(!$('sound').checked)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=ok?'sine':'sawtooth';o.frequency.value=ok?700:180;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);o.start();o.stop(ctx.currentTime+.24)}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function view(id){['start','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(){if(!$('adult').checked){alert('Erst bestätigen, dass du mindestens 18 bist.');return}deck=shuffle([...bank]).slice(0,10);pos=0;points=0;view('game');render()}
function render(){locked=false;let q=deck[pos];$('progress').textContent='Frage '+(pos+1)+'/10';$('score').textContent=points+' Punkte';$('fill').style.width=(pos*10)+'%';$('question').textContent=q[0];$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('answers').replaceChildren();shuffle(q[1].map((label,i)=>({label,i}))).forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.onclick=()=>choose(o.i,b);$('answers').append(b)})}
function choose(i,b){if(locked)return;locked=true;let q=deck[pos],ok=i===q[2];if(ok)points++;beep(ok);[...$('answers').children].forEach(btn=>{btn.disabled=true;if(btn.textContent===q[1][q[2]])btn.classList.add('correct')});if(!ok)b.classList.add('wrong');$('score').textContent=points+' Punkte';$('feedback').textContent=(ok?'🍻 Treffer! ':'💀 Daneben! ')+q[4-1];$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=pos===9?'Das vernichtende Urteil →':'Nächste Gemeinheit →'}
function finish(){view('finish');$('fill').style.width='100%';let rank=points===10?'Großmeister der unnützen Intelligenz':points>=7?'Stammtisch-Orakel':points>=4?'Halbwissender mit Restwürde':'Zertifizierter Vollpfosten';$('result').textContent=points+'/10 – '+rank;$('resultText').textContent=points>=7?'Leider bist du erschreckend kompetent.':points>=4?'Nicht ganz hoffnungslos. Aber auch kein Grund für eine Parade.':'Dein Gehirn hat heute offenbar Betriebsurlaub.';let best=Math.max(points,Number(localStorage.getItem('qmaa-best')||0));localStorage.setItem('qmaa-best',best);$('best').textContent='Dein Rekord: '+best+'/10'}
$('begin').onclick=begin;$('again').onclick=begin;$('next').onclick=()=>{pos++;pos===10?finish():render()};$('share').onclick=async()=>{let t='Ich habe '+points+'/10 bei Quiz mich am Arsch! geschafft. Schaffst du mehr? '+location.href;try{if(navigator.share)await navigator.share({text:t});else if(navigator.clipboard){await navigator.clipboard.writeText(t);alert('Ergebnis kopiert!')}else prompt('Ergebnis kopieren:',t)}catch(e){}};$('best').textContent='Dein Rekord: '+(localStorage.getItem('qmaa-best')||0)+'/10';
</script></body></html>
