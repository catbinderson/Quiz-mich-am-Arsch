let deck=[],pos=0,points=0,locked=false,ctx;const $=id=>document.getElementById(id);
function beep(ok){if(!$('sound').checked)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=ok?'sine':'sawtooth';o.frequency.value=ok?700:180;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);o.start();o.stop(ctx.currentTime+.24)}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function view(id){['start','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(){if(!$('adult').checked){alert('Erst bestätigen, dass du mindestens 18 bist.');return}let cat=$('category').value;let pool=bank.filter(q=>cat==='all'||(cat==='humor'?!q[4]:q[4]===cat));deck=shuffle([...pool]).slice(0,Math.min(10,pool.length));pos=0;points=0;view('game');render()}
function render(){locked=false;let q=deck[pos];$('progress').textContent='Frage '+(pos+1)+'/'+deck.length;$('score').textContent=points+' Punkte';$('fill').style.width=(pos*10)+'%';$('question').textContent=(q[4]?q[4]+' · ':'')+q[0];$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('answers').replaceChildren();shuffle(q[1].map((label,i)=>({label,i}))).forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.onclick=()=>choose(o.i,b);$('answers').append(b)})}
function choose(i,b){if(locked)return;locked=true;let q=deck[pos],ok=i===q[2];if(ok)points++;beep(ok);[...$('answers').children].forEach(btn=>{btn.disabled=true;if(btn.textContent===q[1][q[2]])btn.classList.add('correct')});if(!ok)b.classList.add('wrong');$('score').textContent=points+' Punkte';$('feedback').textContent=(ok?'🍻 Treffer! ':'💀 Daneben! ')+q[4-1];$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=pos===deck.length-1?'Das vernichtende Urteil →':'Nächste Gemeinheit →'}
function finish(){view('finish');$('fill').style.width='100%';let rank=points===10?'Großmeister der unnützen Intelligenz':points>=7?'Stammtisch-Orakel':points>=4?'Halbwissender mit Restwürde':'Zertifizierter Vollpfosten';$('result').textContent=points+'/'+deck.length+' – '+rank;$('resultText').textContent=points>=7?'Leider bist du erschreckend kompetent.':points>=4?'Nicht ganz hoffnungslos. Aber auch kein Grund für eine Parade.':'Dein Gehirn hat heute offenbar Betriebsurlaub.';let best=Math.max(points,Number(localStorage.getItem('qmaa-best')||0));localStorage.setItem('qmaa-best',best);$('best').textContent='Dein Rekord: '+best+'/10'}
$('begin').onclick=begin;$('again').onclick=begin;$('next').onclick=()=>{pos++;pos===deck.length?finish():render()};$('share').onclick=async()=>{let t='Ich habe '+points+'/10 bei Quiz mich am Arsch! geschafft. Schaffst du mehr? '+location.href;try{if(navigator.share)await navigator.share({text:t});else if(navigator.clipboard){await navigator.clipboard.writeText(t);alert('Ergebnis kopiert!')}else prompt('Ergebnis kopieren:',t)}catch(e){}};$('best').textContent='Dein Rekord: '+(localStorage.getItem('qmaa-best')||0)+'/10';
</script></body></html>
